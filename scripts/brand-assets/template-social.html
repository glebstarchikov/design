<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8" />
<style>
__FONT_FACES__

:root {
  __TOKEN_VARS__
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 1280px;
  height: 640px;
  background: var(--bg);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 100px;
  padding-right: 100px;
  font-family: "Geist Sans", sans-serif;
}

.kicker {
  font-family: "Geist Mono", monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 14px;
  font-weight: 500;
  color: var(--faint);
  margin-bottom: 24px;
}

.name {
  font-size: 64px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-bottom: 32px;
  max-width: 1080px;
  overflow-wrap: break-word;
}

.rule {
  width: 64px;
  height: 1px;
  background: var(--border);
  margin-bottom: 32px;
}

.tagline {
  font-size: 24px;
  color: var(--secondary);
  max-width: 900px;
}
</style>
</head>
<body>
  <div class="kicker">glebstarchikov</div>
  <div class="name">__NAME__</div>
  <div class="rule"></div>
  <div class="tagline">__TAGLINE__</div>
</body>
</html>
